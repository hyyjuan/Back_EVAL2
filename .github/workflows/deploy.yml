name: CI/CD Backend

on:
  push:
    branches:
      - deploy

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Login en Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build y Push imagen backend
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/innovatech-backend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/innovatech-backend:${{ github.sha }}

      - name: Deploy en ec2-back
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            echo '${{ secrets.DOCKERHUB_TOKEN }}' | \
              docker login -u '${{ secrets.DOCKERHUB_USERNAME }}' --password-stdin
            docker stop backend || true
            docker rm   backend || true
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/innovatech-backend:latest
            docker run -d \
              --name backend \
              --restart unless-stopped \
              -p 3000:3000 \
              -e PORT=3000 \
              -e DB_HOST=10.0.2.196 \
              -e DB_USER=root \
              -e DB_PASSWORD=admin123 \
              -e DB_NAME=proyecto_db \
              -e DB_PORT=3306 \
              ${{ secrets.DOCKERHUB_USERNAME }}/innovatech-backend:latest
            docker image prune -f